<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kombat Lab</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Kombat Lab</h1>
  <div id="status">Checking system...</div>

  <!-- Notes Section -->
  <div id="notes"></div>
  <button id="addNote">Add Note</button>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => document.getElementById('status').innerText = 'SYSTEM READY')
        .catch(() => document.getElementById('status').innerText = 'REGISTRATION FAILED');
    }

    // Notes Logic
    const notesContainer = document.getElementById('notes');
    document.getElementById('addNote').addEventListener('click', () => {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = `
        <p>New Note</p>
        <button class="delete-btn">Delete</button>
      `;
      notesContainer.appendChild(note);
    });

    document.addEventListener('click', (event) => {
      if (event.target.classList.contains('delete-btn')) {
        const note = event.target.closest('.note');
        note.remove();
      }
    });
  </script>
</body>
</html>Slide clipboard items to delete them
